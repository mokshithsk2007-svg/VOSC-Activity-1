<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A two-player Tic-Tac-Toe game built with HTML, CSS and JavaScript." />
  <title>Tic-Tac-Toe | VOSC Activity-1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1 class="title">Tic<span>·</span>Tac<span>·</span>Toe</h1>

    <!-- Turn indicator -->
    <section class="players" aria-label="Players">
      <div class="player player-x active" id="player-x">
        <span class="player-mark">X</span>
        <span class="player-label">Player 1</span>
      </div>
      <div class="player player-o" id="player-o">
        <span class="player-mark">O</span>
        <span class="player-label">Player 2</span>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Player X's turn</p>

    <!-- Game board -->
    <section class="board" id="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" aria-label="Row 1, Column 1"></button>
      <button class="cell" data-index="1" aria-label="Row 1, Column 2"></button>
      <button class="cell" data-index="2" aria-label="Row 1, Column 3"></button>
      <button class="cell" data-index="3" aria-label="Row 2, Column 1"></button>
      <button class="cell" data-index="4" aria-label="Row 2, Column 2"></button>
      <button class="cell" data-index="5" aria-label="Row 2, Column 3"></button>
      <button class="cell" data-index="6" aria-label="Row 3, Column 1"></button>
      <button class="cell" data-index="7" aria-label="Row 3, Column 2"></button>
      <button class="cell" data-index="8" aria-label="Row 3, Column 3"></button>
    </section>

    <!-- Scoreboard -->
    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score score-x">
        <span class="score-label">X Wins</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score score-draw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score score-o">
        <span class="score-label">O Wins</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </section>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="restart-btn">New Game</button>
      <button class="btn btn-secondary" id="reset-scores-btn">Reset Scores</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
